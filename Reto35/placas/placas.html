<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Placas</title>

    <link rel="stylesheet" href="placas.css" />

    <script src="utilitarios.js"></script>
    <script src="utilitariosCadenas.js"></script>
    <script src="serviciosPlacas.js"></script>
    <script src="placas.js"></script>
</head>

<body>
    <div class="pagina">
        <div class="contenedor">
            <h2 class="titulo">INFORMACIÓN DE LA PLACA</h2>

            <div class="fila">
                <label class="etiqueta">Ingrese la placa</label>
                <input type="text" id="txtPlaca" class="caja" placeholder="Ej: PBC-1234" />
            </div>

            <div class="botones">
                <input type="button" value="VALIDAR" class="btn" onclick="validarPlaca();" />
                <input type="button" value="LIMPIAR" class="btn" onclick="limpiar();" />
            </div>

            <div class="seccion">
                <div class="resultado" id="lblResultado"></div>
                <div class="errores" id="lblErrores"></div>
            </div>

            <div class="seccion info">
                <div class="lineaInfo">
                    <span class="lbl">Provincia:</span>
                    <span id="lblProvincia"></span>
                </div>
                <div class="lineaInfo">
                    <span class="lbl">Tipo de vehículo:</span>
                    <span id="lblTipo"></span>
                </div>
                <div class="lineaInfo">
                    <span class="lbl">Pico y placa:</span>
                    <span id="lblPicoPlaca"></span>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
